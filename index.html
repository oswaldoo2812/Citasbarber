<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberControl - Iniciar Sesión / Registro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .login-card { background: #1e1e1e; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid #2a2a2a; text-align: center; }
        .login-card h1 { color: #d4af37; font-size: 24px; margin-bottom: 8px; }
        .login-card p { color: #aaa; font-size: 13px; margin-bottom: 25px; }

        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #333; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #aaa; font-weight: bold; font-size: 14px; cursor: pointer; }
        .tab-btn.active { color: #d4af37; border-bottom: 2px solid #d4af37; }

        .form-group { display: flex; flex-direction: column; gap: 12px; text-align: left; }
        .form-group label { font-size: 12px; color: #aaa; }
        .form-group input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #d4af37; }

        /* CONTENEDOR PARA EL INPUT Y EL BOTÓN DE OJO */
        .pass-container { position: relative; width: 100%; }
        .pass-container input { padding-right: 42px; }
        .btn-toggle-pass {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer;
            padding: 5px; display: flex; align-items: center; justify-content: center;
        }

        .btn-submit { background: #d4af37; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; margin-top: 15px; transition: background 0.2s; }
        .btn-submit:hover { background: #c5a028; }

        .trial-badge { background: #1b381e; color: #4caf50; border: 1px solid #4caf50; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-bottom: 15px; text-align: center; }

        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: none; justify-content: center; align-items: center;
            z-index: 9999; padding: 20px;
        }

        .modal-box {
            background: #282828; border: 1px solid #444;
            border-radius: 14px; padding: 22px;
            width: 100%; max-width: 380px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7); text-align: center;
        }

        .modal-box p { color: #e0e0e0; font-size: 15px; line-height: 1.5; margin-bottom: 20px; white-space: pre-line; }
        .modal-buttons { display: flex; justify-content: center; gap: 10px; }
        .modal-btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; flex: 1; }
        .modal-btn-ok { background: #d4af37; color: #000; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <p id="modalText"></p>
            <div id="modalButtons" class="modal-buttons"></div>
        </div>
    </div>

    <div class="login-card">
        <h1>💈 BarberControl</h1>
        <p>Sistema de Gestión para Barberías</p>

        <div class="tabs">
            <button id="btnTabLogin" class="tab-btn active" onclick="mostrarTab('login')">Ingresar</button>
            <button id="btnTabRegistro" class="tab-btn" onclick="mostrarTab('registro')">Registrarse</button>
        </div>

        <!-- FORMULARIO LOGIN -->
        <form id="formLogin" onsubmit="iniciarSesion(event)">
            <div class="form-group">
                <label>Usuario o Correo Electrónico</label>
                <input type="text" id="loginUsuario" placeholder="Usuario o tu@correo.com" required>
                
                <label>Contraseña</label>
                <div class="pass-container">
                    <input type="password" id="loginPass" placeholder="••••••••" required>
                    <button type="button" class="btn-toggle-pass" onclick="togglePassVisibility('loginPass', this)">👁️</button>
                </div>
                
                <button type="submit" class="btn-submit">Iniciar Sesión</button>
            </div>
        </form>

        <!-- FORMULARIO REGISTRO -->
        <form id="formRegistro" style="display: none;" onsubmit="registrarUsuario(event)">
            <div class="trial-badge">🎁 ¡Incluye 15 días de prueba gratis!</div>
            
            <div class="form-group">
                <label>Nombre de tu Barbería</label>
                <input type="text" id="regNombre" placeholder="Ej: Barbería El Rey" required>

                <label>Nombre de Usuario (para ingresar)</label>
                <input type="text" id="regUsuario" placeholder="Ej: barberia_elrey (sin espacios)" required>
                
                <label>Contraseña</label>
                <div class="pass-container">
                    <input type="password" id="regPass" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    <button type="button" class="btn-toggle-pass" onclick="togglePassVisibility('regPass', this)">👁️</button>
                </div>
                
                <button type="submit" class="btn-submit">Crear Cuenta y Probar</button>
            </div>
        </form>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCVy7IO3MvdtRBboJS9JbFbvT7lHf8dk04",
          authDomain: "motocontrol-4878c.firebaseapp.com",
          projectId: "motocontrol-4878c",
          storageBucket: "motocontrol-4878c.firebasestorage.app",
          messagingSenderId: "1041662823292",
          appId: "1:1041662823292:web:5431940ff82b618f6432f9",
          measurementId: "G-110QXLC1FC"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function mostrarAlerta(mensaje) {
            return new Promise((resolve) => {
                const modal = document.getElementById("customModal");
                const modalText = document.getElementById("modalText");
                const modalBtns = document.getElementById("modalButtons");

                modalText.innerText = mensaje;
                modalBtns.innerHTML = `<button class="modal-btn modal-btn-ok" id="btnAlertOk">OK</button>`;
                modal.style.display = "flex";

                document.getElementById("btnAlertOk").onclick = () => {
                    modal.style.display = "none";
                    resolve(true);
                };
            });
        }

        // FUNCIÓN PARA ALTERNAR LA VISIBILIDAD DE LA CONTRASEÑA
        function togglePassVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerText = "🙈";
            } else {
                input.type = "password";
                btn.innerText = "👁️";
            }
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "barberia.html";
            }
        });

        function mostrarTab(tab) {
            if (tab === 'login') {
                document.getElementById('formLogin').style.display = 'block';
                document.getElementById('formRegistro').style.display = 'none';
                document.getElementById('btnTabLogin').classList.add('active');
                document.getElementById('btnTabRegistro').classList.remove('active');
            } else {
                document.getElementById('formLogin').style.display = 'none';
                document.getElementById('formRegistro').style.display = 'block';
                document.getElementById('btnTabRegistro').classList.add('active');
                document.getElementById('btnTabLogin').classList.remove('active');
            }
        }

        function iniciarSesion(e) {
            e.preventDefault();
            const inputAcceso = document.getElementById('loginUsuario').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            
            let correoFinal = "";

            if (inputAcceso.includes("@")) {
                correoFinal = inputAcceso.toLowerCase();
            } else {
                let usuarioLimpio = inputAcceso.toLowerCase().replace(/\s+/g, '');
                correoFinal = `${usuarioLimpio}@barbercontrol.app`;
            }

            auth.signInWithEmailAndPassword(correoFinal, pass)
                .then(() => {
                    window.location.href = "barberia.html";
                })
                .catch(async (error) => {
                    await mostrarAlerta("Error al ingresar: Verifica tus datos de acceso y contraseña.");
                });
        }

        function registrarUsuario(e) {
            e.preventDefault();
            const nombre = document.getElementById('regNombre').value.trim();
            const usuarioInput = document.getElementById('regUsuario').value;
            const pass = document.getElementById('regPass').value.trim();

            const usuarioLimpio = usuarioInput.trim().toLowerCase().replace(/\s+/g, '');
            const correoGenerado = `${usuarioLimpio}@barbercontrol.app`;

            auth.createUserWithEmailAndPassword(correoGenerado, pass)
                .then((userCredential) => {
                    const user = userCredential.user;

                    const fechaExpira = new Date();
                    fechaExpira.setDate(fechaExpira.getDate() + 15);

                    return db.collection("usuarios").doc(user.uid).set({
                        nombre: nombre,
                        usuario: usuarioLimpio,
                        correo: correoGenerado,
                        rol: "barberia",
                        expiraEn: fechaExpira.toISOString(),
                        creadoEn: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(async () => {
                    await mostrarAlerta("¡Cuenta creada con éxito! Tienes 15 días de prueba gratis.");
                    window.location.href = "barberia.html";
                })
                .catch(async (error) => {
                    if (error.code === 'auth/email-already-in-use') {
                        await mostrarAlerta("El nombre de usuario ya está ocupado. Intenta con otro.");
                    } else {
                        await mostrarAlerta("Error al registrarse: " + error.message);
                    }
                });
        }
    </script>
</body>
</html>
